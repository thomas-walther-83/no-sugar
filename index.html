<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>No Sugar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Sugar">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3E7C59">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EE;
    --bg-elevated: #FFFFFF;
    --bg-sunken: #EDEAE0;
    --text: #1C2420;
    --text-muted: #5C6862;
    --text-faint: #94988F;
    --border: #DDD8C9;
    --accent-green: #3E7C59;
    --accent-green-soft: #E4EFE7;
    --accent-amber: #A97531;
    --accent-amber-soft: #F5E9D6;
    --accent-red: #9C5B52;
    --accent-red-soft: #F1E3E0;
    --nav-bg: rgba(246,244,238,0.92);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #121A16; --bg-elevated: #1B2620; --bg-sunken: #172119;
      --text: #EDEAE2; --text-muted: #93A19A; --text-faint: #5E6B64; --border: #2B372F;
      --accent-green: #5FA57B; --accent-green-soft: #1E2E24;
      --accent-amber: #D4A15C; --accent-amber-soft: #2E2617;
      --accent-red: #C17D72; --accent-red-soft: #2E1F1C;
      --nav-bg: rgba(18,26,22,0.92);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121A16; --bg-elevated: #1B2620; --bg-sunken: #172119;
    --text: #EDEAE2; --text-muted: #93A19A; --text-faint: #5E6B64; --border: #2B372F;
    --accent-green: #5FA57B; --accent-green-soft: #1E2E24;
    --accent-amber: #D4A15C; --accent-amber-soft: #2E2617;
    --accent-red: #C17D72; --accent-red-soft: #2E1F1C;
    --nav-bg: rgba(18,26,22,0.92);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text); background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overscroll-behavior-y: none;
  }
  h1, h2, h3, .num { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; cursor: pointer; }
  input { font-family: inherit; }

  #app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 10px; }
  .topbar .brand { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .brand span { color: var(--accent-green); }
  .topbar .date { font-size: 0.82rem; color: var(--text-muted); }

  main { flex: 1; padding: 4px 20px 100px; }

  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 14px; }

  .hero-stat { text-align: left; padding: 26px 20px 22px; }
  .hero-stat .label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
  .hero-stat .num { font-size: 3.4rem; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
  .hero-stat .num small { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 500; color: var(--text-muted); }
  .hero-stat .delta { margin-top: 10px; font-size: 0.92rem; color: var(--text-muted); }
  .hero-stat .delta.pos { color: var(--accent-red); }
  .hero-stat .delta.neg { color: var(--accent-green); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
  .stat-cell { background: var(--bg-elevated); padding: 16px 18px; }
  .stat-cell .label { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 4px; }
  .stat-cell .num { font-size: 1.6rem; font-weight: 600; }
  .stat-cell .num.fire { color: var(--accent-amber); }

  .cta-btn { width: 100%; background: var(--accent-green); color: #F6F4EE; border-radius: 14px; padding: 17px; font-size: 1.02rem; font-weight: 600; text-align: center; margin: 4px 0 6px; }
  .cta-btn:active { opacity: 0.85; }
  .cta-btn.done { background: var(--accent-green-soft); color: var(--accent-green); }

  .empty-note { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; padding: 4px 2px 14px; }

  .ring-card { display: flex; align-items: center; gap: 18px; }
  .ring-card .ring { width: 84px; height: 84px; flex: 0 0 auto; }
  .ring-txt .label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 3px; }
  .ring-txt .ring-main { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 600; }

  .wk-card .wk-row { display: flex; gap: 1px; }
  .wk-item { flex: 1; }
  .wk-num { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 600; }
  .wk-num small { font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }
  .wk-num.good { color: var(--accent-green); }

  .pending-banner { background: var(--accent-amber-soft); color: var(--accent-amber); border-radius: 14px; padding: 14px 16px; font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; cursor: pointer; text-align: center; }
  .mile-card { background: var(--accent-green-soft); color: var(--accent-green); border-radius: 14px; padding: 13px 16px; font-size: 0.88rem; font-weight: 500; margin-bottom: 14px; text-align: center; }
  .cal-cell { position: relative; }
  .cal-cell .note-dot { position: absolute; bottom: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.65; }

  .seg-row { display: flex; gap: 6px; background: var(--bg-sunken); border-radius: 12px; padding: 4px; }
  .seg-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font-size: 0.86rem; font-weight: 500; color: var(--text-muted); }
  .seg-btn.active { background: var(--bg-elevated); color: var(--text); font-weight: 600; }
  .note-input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; background: var(--bg-elevated); color: var(--text); resize: none; min-height: 60px; }
  .note-input:focus { outline: none; border-color: var(--accent-green); }
  .section-title { font-size: 1.15rem; font-weight: 600; margin: 22px 2px 10px; }
  .section-title:first-child { margin-top: 6px; }

  .q-block { margin-bottom: 26px; }
  .q-label { font-size: 1.02rem; font-weight: 500; margin-bottom: 12px; }
  .yn-row { display: flex; gap: 10px; }
  .yn-btn { flex: 1; padding: 18px 0; border-radius: 14px; background: var(--bg-sunken); border: 1.5px solid var(--border); font-size: 1rem; font-weight: 600; text-align: center; color: var(--text-muted); }
  .yn-btn.yes.active { background: var(--accent-green-soft); border-color: var(--accent-green); color: var(--accent-green); }
  .yn-btn.no.active { background: var(--accent-red-soft); border-color: var(--accent-red); color: var(--accent-red); }

  .mood-row { display: flex; justify-content: space-between; gap: 6px; }
  .mood-btn { flex: 1; padding: 12px 0 8px; border-radius: 14px; text-align: center; border: 1.5px solid transparent; font-size: 1.7rem; background: var(--bg-sunken); }
  .mood-btn span { display: block; font-size: 0.62rem; color: var(--text-muted); margin-top: 4px; font-family: 'Inter', sans-serif; }
  .mood-btn.active { border-color: var(--accent-amber); background: var(--accent-amber-soft); }

  .weight-ctrl { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 10px 0 4px; }
  .weight-step { width: 50px; height: 50px; border-radius: 50%; background: var(--bg-sunken); border: 1.5px solid var(--border); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .weight-step:active { background: var(--accent-green-soft); }
  .weight-input { border: none; background: none; text-align: center; font-family: 'Fraunces', serif; font-size: 2.6rem; font-weight: 600; width: 150px; color: var(--text); }
  .weight-input:focus { outline: none; }
  .weight-ref { text-align: center; font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

  .save-summary { text-align: center; padding: 10px 4px 4px; }
  .save-summary .big-emoji { font-size: 2.6rem; margin-bottom: 6px; }
  .save-summary h2 { margin: 0 0 6px; font-size: 1.3rem; }
  .save-summary p { color: var(--text-muted); font-size: 0.92rem; margin: 4px 0; }
  .badge-pop { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-amber-soft); color: var(--accent-amber); border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 0.88rem; font-weight: 600; }

  .tab-row { display: flex; gap: 6px; background: var(--bg-sunken); border-radius: 12px; padding: 4px; margin: 4px 0 18px; }
  .tab-btn { flex: 1; text-align: center; padding: 9px 2px; border-radius: 9px; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
  .tab-btn.active { background: var(--bg-elevated); color: var(--text); font-weight: 600; }
  .bilanz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .bilanz-num { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 600; }
  .bilanz-num small { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
  .bilanz-num.good { color: var(--accent-green); }

  .range-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .range-btn { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; color: var(--text-muted); border: 1px solid var(--border); }
  .range-btn.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

  svg.chart { width: 100%; height: auto; overflow: visible; }
  .chart-empty { text-align:center; padding: 40px 10px; color: var(--text-muted); font-size: 0.9rem; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav .month-label { font-weight: 600; font-size: 1rem; }
  .cal-nav button { font-size: 1.1rem; padding: 4px 10px; color: var(--text-muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-wd { text-align: center; font-size: 0.68rem; color: var(--text-faint); padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: var(--text-muted); background: var(--bg-sunken); }
  .cal-cell.yes { background: var(--accent-green); color: #fff; }
  .cal-cell.no { background: var(--accent-red); color: #fff; }
  .cal-cell.blank { background: transparent; }
  .cal-legend { display: flex; gap: 16px; margin-top: 14px; font-size: 0.78rem; color: var(--text-muted); }
  .cal-legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

  .mood-timeline { display: flex; overflow-x: auto; gap: 14px; padding: 4px 2px 10px; }
  .mood-tl-item { flex: 0 0 auto; text-align: center; }
  .mood-tl-item .e { font-size: 1.5rem; }
  .mood-tl-item .d { font-size: 0.66rem; color: var(--text-faint); margin-top: 4px; }

  .ach-group { margin-bottom: 22px; }
  .ach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ach-badge { text-align: center; }
  .ach-badge .circ { width: 100%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: var(--bg-sunken); border: 1.5px solid var(--border); color: var(--text-faint); }
  .ach-badge.unlocked .circ { background: var(--accent-amber-soft); border-color: var(--accent-amber); color: var(--accent-amber); }
  .ach-badge.major.unlocked .circ { background: var(--accent-green); border-color: var(--accent-green); color: #fff; }
  .ach-badge .t { font-size: 0.62rem; margin-top: 5px; color: var(--text-muted); line-height: 1.2; }

  .field-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; border-bottom: 1px solid var(--border); }
  .field-row:last-child { border-bottom: none; }
  .field-row .fl { font-size: 0.95rem; }
  .field-row input[type=number] { border: none; background: none; text-align: right; font-size: 1rem; width: 90px; color: var(--text); font-weight: 600; }
  .field-row input:focus { outline: none; }
  .btn-outline { width: 100%; text-align: center; padding: 14px; border: 1.5px solid var(--border); border-radius: 14px; font-size: 0.92rem; font-weight: 500; color: var(--text-muted); }
  .btn-danger { border-color: var(--accent-red); color: var(--accent-red); }
  .fs { font-size: 0.78rem; color: var(--text-faint); line-height: 1.5; }

  nav.tabbar { position: sticky; bottom: 0; left: 0; right: 0; display: flex; background: var(--nav-bg); backdrop-filter: blur(14px); border-top: 1px solid var(--border); padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; }
  nav.tabbar .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--text-faint); font-size: 0.64rem; font-family: 'Inter', sans-serif; }
  nav.tabbar .nav-btn .ic { font-size: 1.25rem; }
  nav.tabbar .nav-btn.active { color: var(--accent-green); }

  .onboard-wrap { padding: 60px 26px; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .onboard-wrap h1 { font-size: 2.1rem; margin: 0 0 8px; }
  .onboard-wrap .sub { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; line-height: 1.5; }
  .onboard-field { margin-bottom: 22px; }
  .onboard-field label { display: block; font-size: 0.86rem; color: var(--text-muted); margin-bottom: 8px; }
  .onboard-field input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 1.3rem; background: var(--bg-elevated); color: var(--text); font-family: 'Fraunces', serif; font-weight: 600; }
  .onboard-field input:focus { outline: none; border-color: var(--accent-green); }
  .onboard-field .hint { font-size: 0.76rem; color: var(--text-faint); margin-top: 6px; }

  #confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
  .confetti-piece { position: absolute; top: -12px; border-radius: 2px; }
  .back-row { display:flex; align-items:center; margin: 4px 0 14px; }
  .back-row button { font-size: 0.9rem; color: var(--text-muted); padding: 4px 0; }

  /* chart axis + target line */
  .chart-wrap { position: relative; }
  .chart-caption { display:flex; justify-content:space-between; margin-top:10px; font-size:0.76rem; color:var(--text-muted); }
  .chart-legend { display:flex; gap:16px; margin-top:10px; font-size:0.76rem; color:var(--text-muted); align-items:center; }
  .chart-legend .ln { width:16px; height:0; border-top:2px solid var(--accent-green); display:inline-block; margin-right:6px; vertical-align:middle; }
  .chart-legend .ln.dashed { border-top:2px dashed var(--accent-amber); }

  /* year heatmap */
  .hm-scroll { overflow-x:auto; padding-bottom:6px; }
  .hm-grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 12px); gap:3px; }
  .hm-cell { width:12px; height:12px; border-radius:3px; background:var(--bg-sunken); }
  .hm-cell.yes { background:var(--accent-green); }
  .hm-cell.no { background:var(--accent-red); }
  .hm-cell.future { background:transparent; }
  .hm-months { display:flex; gap:0; margin-bottom:6px; font-size:0.62rem; color:var(--text-faint); }

  /* mini-months for quarter view */
  .mini-months { display:grid; grid-template-columns:1fr; gap:14px; }
  .mini-title { font-size:0.86rem; font-weight:600; margin-bottom:8px; }
  .mini-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .mini-cell { aspect-ratio:1; border-radius:6px; background:var(--bg-sunken); display:flex; align-items:center; justify-content:center; font-size:0.62rem; color:var(--text-muted); }
  .mini-cell.yes { background:var(--accent-green); color:#fff; }
  .mini-cell.no { background:var(--accent-red); color:#fff; }
  .mini-cell.blank { background:transparent; }

  /* celebration overlay */
  #celebrate-layer { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; background: rgba(20,26,22,0.55); backdrop-filter: blur(3px); padding: 30px; }
  #celebrate-layer.show { display: flex; }
  .celebrate-card { background: var(--bg-elevated); border-radius: 24px; padding: 34px 28px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.28); animation: pop-in 0.5s cubic-bezier(.2,1.1,.4,1) both; }
  .celebrate-card .emoji { font-size: 3.4rem; animation: badge-bounce 0.9s ease 0.15s both; }
  .celebrate-card h2 { font-size: 1.5rem; margin: 12px 0 4px; }
  .celebrate-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 20px; }
  .celebrate-card button { background: var(--accent-green); color: #F6F4EE; border-radius: 12px; padding: 13px 28px; font-weight: 600; font-size: 0.95rem; }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes badge-bounce { 0%{transform:scale(0.4) rotate(-12deg);} 55%{transform:scale(1.18) rotate(6deg);} 100%{transform:scale(1) rotate(0);} }
  .badge-pop { animation: badge-bounce 0.7s ease both; }
  @media (prefers-reduced-motion: reduce) {
    .celebrate-card, .celebrate-card .emoji, .badge-pop { animation: none !important; }
  }

  #boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; color: var(--text-faint); font-size: 0.9rem; }
</style>
</head>
<body>
<div id="app"><div id="boot">Lade…</div></div>
<div id="confetti-layer"></div>
<div id="celebrate-layer"><div class="celebrate-card" id="celebrate-card"></div></div>

<script>
(function(){
  "use strict";

  /* ==========================================================
     STORAGE LAYER — IndexedDB (durable, local-first)
     DB: nosugar
       - entries      keyPath "date"   {date, sugarFree, mood, weight}
       - achievements keyPath "id"     {id, title, category, unlockDate, major}
       - meta         keyPath "key"    {key:"settings", value:{...}}
     All data stays on the device. Nothing is sent anywhere.
     ========================================================== */
  var DB_NAME = 'nosugar', DB_VERSION = 1;
  var db = null;

  function openDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'date' });
        if (!d.objectStoreNames.contains('achievements')) d.createObjectStore('achievements', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = function(e) { resolve(e.target.result); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }
  function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
  function getAll(store) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readonly').getAll(); r.onsuccess = function(){ resolve(r.result||[]); }; r.onerror = function(){ resolve([]); }; }
      catch(e) { resolve([]); }
    });
  }
  function getOne(store, key) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readonly').get(key); r.onsuccess = function(){ resolve(r.result||null); }; r.onerror = function(){ resolve(null); }; }
      catch(e) { resolve(null); }
    });
  }
  function putRec(store, rec) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readwrite').put(rec); r.onsuccess = function(){ resolve(true); }; r.onerror = function(){ resolve(false); }; }
      catch(e) { resolve(false); }
    });
  }
  function clearStore(store) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readwrite').clear(); r.onsuccess = function(){ resolve(true); }; r.onerror = function(){ resolve(false); }; }
      catch(e) { resolve(false); }
    });
  }
  function requestPersistence() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {} }

  function applyTheme() {
    var t = (state.settings && state.settings.theme) ? state.settings.theme : 'auto';
    var root = document.documentElement;
    if (t === 'light') root.setAttribute('data-theme', 'light');
    else if (t === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
  }

  /* ==========================================================
     IN-MEMORY STATE (mirror of IndexedDB, drives synchronous render)
     ========================================================== */
  var state = {
    settings: null,
    entries: {},
    achievements: [],
    view: 'home',
    progressTab: 'weight',
    weightRange: 30,
    sugarView: 'month',   // month | quarter | year
    moodRange: 30,
    calMonth: new Date().getMonth(),
    calYear: new Date().getFullYear(),
    activeDate: null,   // date currently being entered/edited (defaults to today)
    draft: null,
    lastResult: null,
    note: null,
    animatedStreak: false
  };

  function persistSettings() { if (state.settings) putRec('meta', { key: 'settings', value: state.settings }); }
  function persistEntry(dateStr) { putRec('entries', Object.assign({ date: dateStr }, state.entries[dateStr])); }
  function persistAchievement(a) { putRec('achievements', a); }

  /* ==========================================================
     DATE HELPERS
     ========================================================== */
  function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function todayStr() { return fmtDate(new Date()); }
  function yesterdayStr() { var d = new Date(); d.setDate(d.getDate()-1); return fmtDate(d); }
  function addDays(str, n) { var d = new Date(str + 'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
  function niceDate(str) { return new Date(str + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' }); }
  function niceShort(str) { return new Date(str + 'T00:00:00').toLocaleDateString('de-CH', { day: 'numeric', month: 'short' }); }
  var WEEKDAYS_DE = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  var MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  var MOOD_TO_LABEL = { 5:'very_good', 4:'good', 3:'neutral', 2:'difficult', 1:'very_difficult' };
  var LABEL_TO_MOOD = { very_good:5, good:4, neutral:3, difficult:2, very_difficult:1 };

  /* ==========================================================
     DERIVED DATA
     ========================================================== */
  function sortedDates() { return Object.keys(state.entries).sort(); }
  function latestEntry() { var ds = sortedDates(); return ds.length ? { date: ds[ds.length-1], entry: state.entries[ds[ds.length-1]] } : null; }
  function currentWeight() {
    var le = latestEntry();
    if (le && le.entry.weight != null) return le.entry.weight;
    return state.settings ? state.settings.startWeight : null;
  }
  function referenceWeightFor(dateStr) {
    var ds = sortedDates().filter(function(d){ return d < dateStr && state.entries[d].weight != null; });
    if (ds.length) return state.entries[ds[ds.length-1]].weight;
    return state.settings ? state.settings.startWeight : null;
  }
  function computeStreaks() {
    var ds = sortedDates();
    var best = 0, run = 0, totalSugarFree = 0, prevDate = null;
    ds.forEach(function(d) {
      var e = state.entries[d];
      if (e.sugarFree === true) {
        totalSugarFree++;
        if (prevDate && addDays(prevDate,1) === d) run++; else run = 1;
        if (run > best) best = run;
      } else if (e.sugarFree === false) { run = 0; }
      prevDate = d;
    });
    var current = 0;
    var cursor = state.entries[todayStr()] ? todayStr() : yesterdayStr();
    while (state.entries[cursor] && state.entries[cursor].sugarFree === true) { current++; cursor = addDays(cursor, -1); }
    return { current: current, best: best, totalSugarFree: totalSugarFree };
  }

  var STREAK_ACH = [5,10,15,20,25,30,35,40,45,50,60,70,80,90,100];
  var WEEK_ACH = [ {d:7,l:'1 Woche'}, {d:14,l:'2 Wochen'}, {d:21,l:'3 Wochen'}, {d:28,l:'4 Wochen'}, {d:56,l:'8 Wochen'}, {d:84,l:'12 Wochen'}, {d:182,l:'26 Wochen'}, {d:364,l:'52 Wochen'} ];
  var WEIGHT_MAJOR = [5,10,15,20,25,30];

  function computeAndUnlockAchievements() {
    var streaks = computeStreaks();
    var unlockedIds = {};
    state.achievements.forEach(function(a){ unlockedIds[a.id] = true; });
    var newly = [];
    function add(a) { state.achievements.push(a); newly.push(a); unlockedIds[a.id] = true; persistAchievement(a); }
    STREAK_ACH.forEach(function(n) {
      var id = 'streak-' + n;
      if (streaks.current >= n && !unlockedIds[id]) add({ id: id, title: n + ' Tage zuckerfrei', category: 'streak', unlockDate: todayStr(), major: false });
    });
    WEEK_ACH.forEach(function(w) {
      var id = 'week-' + w.d;
      if (streaks.current >= w.d && !unlockedIds[id]) add({ id: id, title: w.l + ' Serie', category: 'week', unlockDate: todayStr(), major: true });
    });
    if (state.settings && state.settings.startWeight != null) {
      var cw = currentWeight();
      if (cw != null && cw < state.settings.startWeight) {
        var lostKg = Math.floor(state.settings.startWeight - cw);
        for (var k = 1; k <= lostKg; k++) {
          var wid = 'weight-' + k;
          if (!unlockedIds[wid]) add({ id: wid, title: k + ' kg verloren', category: 'weight', unlockDate: todayStr(), major: WEIGHT_MAJOR.indexOf(k) !== -1 });
        }
      }
    }
    return newly;
  }
  function computePoints() {
    var pts = 0;
    sortedDates().forEach(function(d) { pts += 1; if (state.entries[d].sugarFree === true) pts += 5; });
    state.achievements.forEach(function(a) { if (a.category === 'week') pts += 10; });
    return pts;
  }

  /* ==========================================================
     EXPORT / IMPORT
     ========================================================== */
  function buildExportObject() {
    var days = sortedDates().map(function(d) {
      var e = state.entries[d];
      return { date: d, weight: e.weight, sugarFree: e.sugarFree, mood: e.mood != null ? MOOD_TO_LABEL[e.mood] : null, note: e.note || null };
    });
    return { app: 'No Sugar', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, achievements: state.achievements, days: days };
  }
  function exportBackup() {
    var json = JSON.stringify(buildExportObject(), null, 2);
    var filename = 'no-sugar-backup-' + todayStr() + '.json';
    try {
      if (navigator.canShare) {
        var file = new File([json], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: filename }).catch(function(){}); return; }
      }
    } catch(e) {}
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 120);
      return;
    } catch(e) {}
    window.prompt('Sicherungstext kopieren und selbst speichern:', json);
  }
  function applyImport(data) {
    var days = Array.isArray(data) ? data : (data && data.days);
    if (!days || !Array.isArray(days)) { state.note = { type: 'err', text: 'Datei enthält keine gültigen No-Sugar-Daten.' }; render(); return; }
    if (!window.confirm('Aktuelle Daten auf diesem Gerät durch die Sicherung ersetzen?')) return;
    Promise.all([clearStore('entries'), clearStore('achievements'), clearStore('meta')]).then(function() {
      state.entries = {}; state.achievements = [];
      days.forEach(function(rec) {
        if (!rec || !rec.date) return;
        var mood = (typeof rec.mood === 'number') ? rec.mood : (rec.mood != null ? LABEL_TO_MOOD[rec.mood] : null);
        state.entries[rec.date] = {
          sugarFree: (rec.sugarFree === true || rec.sugarFree === false) ? rec.sugarFree : null,
          mood: mood != null ? mood : null,
          weight: (typeof rec.weight === 'number') ? rec.weight : null,
          note: (rec.note && String(rec.note).trim()) ? String(rec.note).trim() : null
        };
        persistEntry(rec.date);
      });
      if (!Array.isArray(data) && data.settings) { state.settings = data.settings; persistSettings(); }
      if (!Array.isArray(data) && Array.isArray(data.achievements)) { state.achievements = data.achievements.slice(); state.achievements.forEach(persistAchievement); }
      else { computeAndUnlockAchievements(); }
      state.note = { type: 'ok', text: 'Sicherung wiederhergestellt.' };
      state.view = 'home';
      render();
    });
  }

  /* ==========================================================
     CONFETTI
     ========================================================== */
  function fireConfetti() {
    var layer = document.getElementById('confetti-layer');
    var colors = ['#3E7C59','#A97531','#5FA57B','#D4A15C','#EDEAE2'];
    for (var i = 0; i < 36; i++) (function(i){
      var p = document.createElement('div');
      p.className = 'confetti-piece';
      var size = 6 + Math.random()*6;
      p.style.width = size + 'px'; p.style.height = (size*0.4) + 'px';
      p.style.left = (Math.random()*100) + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
      layer.appendChild(p);
      var anim = p.animate([
        { transform: p.style.transform + ' translate(0,0)', opacity: 1 },
        { transform: 'rotate(' + (Math.random()*720) + 'deg) translate(' + ((Math.random()-0.5)*160) + 'px, 100vh)', opacity: 0.9 }
      ], { duration: 1600 + Math.random()*1200, easing: 'cubic-bezier(.25,.46,.45,.94)' });
      anim.onfinish = function(){ p.remove(); };
    })(i);
  }

  function showCelebration(ach) {
    var layer = document.getElementById('celebrate-layer');
    var card = document.getElementById('celebrate-card');
    if (!layer || !card) return;
    card.innerHTML = '<div class="emoji">' + (ach.category==='weight' ? '🎉' : '🏆') + '</div>' +
      '<h2>' + ach.title + '</h2>' +

      '<button data-action="close-celebrate">Weiter</button>';

  /* ==========================================================
     RENDER
     ========================================================== */
  var app = document.getElementById('app');
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

  function render() {
    if (!state.settings || !state.settings.onboarded) { app.innerHTML = ''; app.appendChild(renderOnboarding()); return; }
    app.innerHTML = '';
    app.appendChild(el('<div class="topbar"><div class="brand">No <span>Sugar</span></div><div class="date">' + niceDate(todayStr()) + '</div></div>'));
    var main = document.createElement('main');
    if (state.view === 'home') main.appendChild(renderHome());
    else if (state.view === 'checkin') main.appendChild(renderCheckin());
    else if (state.view === 'result') main.appendChild(renderResult());
    else if (state.view === 'progress') main.appendChild(renderProgress());
    else if (state.view === 'achievements') main.appendChild(renderAchievements());
    else if (state.view === 'settings') main.appendChild(renderSettings());
    app.appendChild(main);
    if (state.view !== 'result') app.appendChild(renderNav());
  }

  function renderOnboarding() {
    var wrap = el(
      '<div class="onboard-wrap">' +
        '<h1>No Sugar</h1>' +
        '<div class="sub">Ein ruhiges Werkzeug für zuckerfreie Tage, Gewicht und Stimmung. Alle Daten bleiben lokal auf diesem Gerät.</div>' +
        '<div class="onboard-field"><label>Startgewicht (kg)</label><input type="number" inputmode="decimal" step="0.1" id="ob-start" placeholder="z. B. 86.4"></div>' +
        '<div class="onboard-field"><label>Zielgewicht (kg) — optional</label><input type="number" inputmode="decimal" step="0.1" id="ob-target" placeholder="z. B. 78.0"><div class="hint">Später in den Einstellungen änderbar.</div></div>' +
        '<button class="cta-btn" id="ob-save" style="margin-top:auto;">Loslegen</button>' +
      '</div>'
    );
    wrap.querySelector('#ob-save').addEventListener('click', function() {
      var sv = parseFloat(document.getElementById('ob-start').value);
      var tv = parseFloat(document.getElementById('ob-target').value);
      if (!sv || isNaN(sv)) { document.getElementById('ob-start').focus(); return; }
      state.settings = { startWeight: sv, targetWeight: isNaN(tv) ? null : tv, onboarded: true };
      persistSettings();
      requestPersistence();
      render();
    });
    return wrap;
  }

  function renderHome() {
    var wrap = document.createElement('div');
    var cw = currentWeight(), streaks = computeStreaks(), hasToday = !!state.entries[todayStr()], startW = state.settings.startWeight;
    var diffStart = (cw != null && startW != null) ? (cw - startW) : null;
    var heroDelta = '';
    if (diffStart != null) {
      var cls = diffStart > 0 ? 'pos' : (diffStart < 0 ? 'neg' : '');
      heroDelta = '<div class="delta ' + cls + '">' + (diffStart>0?'+':'') + diffStart.toFixed(1) + ' kg seit Start (' + startW.toFixed(1) + ' kg)</div>';
    }
    wrap.appendChild(el('<div class="card hero-stat"><div class="label">Aktuelles Gewicht</div><div class="num">' + (cw!=null?cw.toFixed(1):'—') + '<small>kg</small></div>' + heroDelta + '</div>'));

    // Progress ring toward target weight
    var target = state.settings.targetWeight;
    if (target != null && startW != null && cw != null && startW !== target) {
      var prog = (startW - cw) / (startW - target);
      prog = Math.max(0, Math.min(1, prog));
      var pct = Math.round(prog * 100);
      var lost = Math.max(0, startW - cw), toLose = startW - target;
      var C = 2 * Math.PI * 34;
      var off = C * (1 - prog);
      wrap.appendChild(el(
        '<div class="card ring-card">' +
          '<svg viewBox="0 0 80 80" class="ring">' +
            '<circle cx="40" cy="40" r="34" fill="none" stroke="var(--bg-sunken)" stroke-width="8"/>' +
            '<circle cx="40" cy="40" r="34" fill="none" stroke="var(--accent-green)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 40 40)"/>' +
            '<text x="40" y="45" text-anchor="middle" font-size="17" font-weight="600" fill="var(--text)" font-family="Fraunces,serif">'+pct+'%</text>' +
          '</svg>' +
          '<div class="ring-txt"><div class="label">Weg zum Ziel</div><div class="ring-main">'+lost.toFixed(1)+' von '+toLose.toFixed(1)+' kg</div><div class="fs">Ziel: '+target.toFixed(1)+' kg</div></div>' +
        '</div>'
      ));
    }

    wrap.appendChild(el(
      '<div class="stat-grid">' +
        '<div class="stat-cell"><div class="label">Aktuelle Serie</div><div class="num fire">🔥 <span id="streak-num">' + streaks.current + '</span>' + (streaks.current===1?' Tag':' Tage') + '</div></div>' +
        '<div class="stat-cell"><div class="label">Beste Serie</div><div class="num">' + streaks.best + (streaks.best===1?' Tag':' Tage') + '</div></div>' +
        '<div class="stat-cell"><div class="label">Zuckerfreie Tage total</div><div class="num">' + streaks.totalSugarFree + '</div></div>' +
        '<div class="stat-cell"><div class="label">Punkte</div><div class="num">' + computePoints() + '</div></div>' +
      '</div>'
    ));

    // Milestone preview / restart encouragement
    var mile = nextStreakMilestone(streaks.current);
    if (streaks.current === 0 && Object.keys(state.entries).length > 0) {
      wrap.appendChild(el('<div class="mile-card">🌱 Neuanfang — heute zählt wieder. Ein Tag nach dem anderen.</div>'));
    } else if (mile) {
      wrap.appendChild(el('<div class="mile-card">🔥 Noch ' + mile.remaining + (mile.remaining===1?' Tag':' Tage') + ' bis zur ' + mile.label + '.</div>'));
    }

    // Weekly review (last 7 days incl. today)
    var wk = weeklyReview();
    if (wk.entries > 0) {
      wrap.appendChild(el(
        '<div class="card wk-card">' +
          '<div class="label" style="margin-bottom:8px;">Letzte 7 Tage</div>' +
          '<div class="wk-row">' +
            '<div class="wk-item"><div class="wk-num">'+wk.sugarFree+'<small>/7</small></div><div class="fs">zuckerfrei</div></div>' +
            '<div class="wk-item"><div class="wk-num ' + (wk.weightDiff!=null && wk.weightDiff<0?'good':'') + '">'+(wk.weightDiff!=null?((wk.weightDiff>0?'+':'')+wk.weightDiff.toFixed(1)):'—')+'<small> kg</small></div><div class="fs">Gewicht</div></div>' +
          '</div>' +
        '</div>'
      ));
    }

    if (!hasToday) wrap.appendChild(el('<div class="pending-banner" data-action="go-checkin">📝 Heutiger Check-in steht noch aus — jetzt erfassen</div>'));
    wrap.appendChild(el('<button class="cta-btn ' + (hasToday?'done':'') + '" data-action="go-checkin">' + (hasToday?'Heute bereits erfasst — bearbeiten':'Heutiger Check-in') + '</button>'));
    if (Object.keys(state.entries).length === 0) wrap.appendChild(el('<div class="empty-note">Noch keine Einträge. Der erste Check-in dauert unter 15 Sekunden.</div>'));
    if (!state.animatedStreak && streaks.current > 0) {
      state.animatedStreak = true;
      setTimeout(function(){ countUp('streak-num', streaks.current); }, 60);
    }
    return wrap;
  }

  function prefersReducedMotion() {
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) { return false; }
  }
  function countUp(id, to) {
    var e = document.getElementById(id); if (!e) return;
    if (prefersReducedMotion() || to <= 1) { e.textContent = to; return; }
    var dur = 650, start = null;
    function tick(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      e.textContent = Math.round((1 - Math.pow(1-p, 3)) * to);
      if (p < 1) requestAnimationFrame(tick);
    }
    e.textContent = '0';
    requestAnimationFrame(tick);
  }

  function nextStreakMilestone(current) {
    var targets = [];
    STREAK_ACH.forEach(function(n){ targets.push({ v:n, label: n + '-Tage-Serie' }); });
    WEEK_ACH.forEach(function(w){ targets.push({ v:w.d, label: w.l + '-Serie' }); });
    targets.sort(function(a,b){ return a.v - b.v; });
    for (var i=0;i<targets.length;i++) { if (targets[i].v > current) return { target: targets[i].v, remaining: targets[i].v - current, label: targets[i].label }; }
    return null;
  }

  function weeklyReview() {
    var today = todayStr(), sugarFree = 0, entries = 0;
    for (var i = 0; i < 7; i++) {
      var d = addDays(today, -i), e = state.entries[d];
      if (e) { entries++; if (e.sugarFree === true) sugarFree++; }
    }
    // weight change across the last 7 days
    var recent = sortedDates().filter(function(d){ return state.entries[d].weight != null && d <= today && d >= addDays(today,-6); });
    var weightDiff = null;
    if (recent.length >= 2) weightDiff = state.entries[recent[recent.length-1]].weight - state.entries[recent[0]].weight;
    return { sugarFree: sugarFree, entries: entries, weightDiff: weightDiff };
  }

    var refWeight = referenceWeightFor(d);

    var moods = [ {v:5,e:'😁',l:'Sehr gut'}, {v:4,e:'🙂',l:'Gut'}, {v:3,e:'😐',l:'Neutral'}, {v:2,e:'😕',l:'Schwierig'}, {v:1,e:'😫',l:'Sehr schwer'} ];
    var moodRow = '<div class="mood-row">' + moods.map(function(m){ return '<button class="mood-btn" data-action="set-mood" data-val="'+m.v+'">'+m.e+'<span>'+m.l+'</span></button>'; }).join('') + '</div>';
    wrap.appendChild(el('<div class="q-block"><div class="q-label">' + (isToday ? 'Wie fühlst du dich heute?' : 'Stimmung an diesem Tag?') + '</div>' + moodRow + '</div>'));
    wrap.appendChild(el(
      '<div class="q-block"><div class="q-label">Gewicht</div>' +

        '<input class="weight-input" id="weight-input" type="number" inputmode="decimal" step="0.1" value="' + state.draft.weight.toFixed(1) + '">' +
        '<button class="weight-step" data-action="w-plus">+</button></div>' +
        '<div class="weight-ref">' + (refWeight!=null?('Vorheriger Wert: '+refWeight.toFixed(1)+' kg'):'Kein früherer Wert vorhanden') + '</div>' +
      '</div>'
    ));
    wrap.appendChild(el(
      '<div class="q-block"><div class="q-label">Notiz <span style="color:var(--text-faint);font-weight:400;">(optional)</span></div>' +
        '<textarea class="note-input" id="note-input" placeholder="z. B. auswärts gegessen, Geburtstag …" maxlength="280">' + (state.draft.note ? String(state.draft.note).replace(/</g,'&lt;') : '') + '</textarea>' +
      '</div>'
    ));
    wrap.appendChild(el('<button class="cta-btn" data-action="save-entry">' + (isToday ? 'Heute speichern' : 'Tag speichern') + '</button>'));
    setTimeout(function() {
      var wi = document.getElementById('weight-input');
      if (wi) wi.addEventListener('input', function() { var v = parseFloat(wi.value); if (!isNaN(v)) state.draft.weight = v; });
      var di = document.getElementById('entry-date');

      var ni = document.getElementById('note-input');

  }
  function syncCheckinUI() {
    document.querySelectorAll('.yn-btn').forEach(function(b) { b.classList.toggle('active', state.draft.sugarFree === (b.getAttribute('data-val') === 'true')); });
    document.querySelectorAll('.mood-btn').forEach(function(b) { b.classList.toggle('active', state.draft.mood === parseInt(b.getAttribute('data-val'),10)); });
    var wi = document.getElementById('weight-input'); if (wi && document.activeElement !== wi) wi.value = state.draft.weight.toFixed(1);
  }

  function periodStats(from, to) {
    var ds = sortedDates().filter(function(d){ return d >= from && d <= to; });
    var total = ds.length, sugarFree = 0, best = 0, run = 0, prev = null;
    var weighted = ds.filter(function(d){ return state.entries[d].weight != null; });
    ds.forEach(function(d) {
      if (state.entries[d].sugarFree === true) {
        sugarFree++;
        if (prev && addDays(prev,1) === d) run++; else run = 1;
        if (run > best) best = run;
      } else if (state.entries[d].sugarFree === false) { run = 0; }
      prev = d;
    });
    var net = null;
    if (weighted.length >= 2) net = state.entries[weighted[weighted.length-1]].weight - state.entries[weighted[0]].weight;
    var quote = total > 0 ? Math.round(sugarFree / total * 100) : 0;
    return { total: total, sugarFree: sugarFree, best: best, net: net, quote: quote };
  }

  function summaryCard(title, from, to) {

    if (s.total === 0) return '<div class="card"><div class="label" style="margin-bottom:6px;">'+title+'</div><div class="fs">Noch keine Einträge in diesem Zeitraum.</div></div>';
    return '<div class="card">' +

        '<div class="bilanz-cell"><div class="bilanz-num ' + (s.net!=null&&s.net<0?'good':'') + '">'+(s.net!=null?((s.net>0?'+':'')+s.net.toFixed(1)):'—')+'<small> kg</small></div><div class="fs">Netto-Gewicht</div></div>' +
      '</div></div>';
  }

  /* Shared line chart with Y-axis labels. opts:
     data: [{label, v}], min, max, yTicks:[{v,label}], target:{v,label}|null,
     color, fmt(v), xLabels:{left,right} */
  function buildLineChart(opts) {
    var W = 340, H = 190, L = 40, R = 14, T = 14, B = 24;
    var iw = W - L - R, ih = H - T - B;
    var min = opts.min, max = opts.max, n = opts.data.length;
    function yPix(v) { return T + (1 - (v - min) / (max - min)) * ih; }
    function xPix(i) { return L + (n <= 1 ? iw/2 : (i / (n - 1)) * iw); }
    var svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
    // gridlines + y labels
    opts.yTicks.forEach(function(t) {
      var y = yPix(t.v).toFixed(1);
      svg += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
      svg += '<text x="'+(L-6)+'" y="'+(parseFloat(y)+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--text-faint)" font-family="Inter,sans-serif">'+t.label+'</text>';
    });
    // target line
    if (opts.target && opts.target.v >= min && opts.target.v <= max) {
      var ty = yPix(opts.target.v).toFixed(1);
      svg += '<line x1="'+L+'" y1="'+ty+'" x2="'+(W-R)+'" y2="'+ty+'" stroke="var(--accent-amber)" stroke-width="1.6" stroke-dasharray="5 4"/>';
      svg += '<text x="'+(W-R)+'" y="'+(parseFloat(ty)-4).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--accent-amber)" font-family="Inter,sans-serif">'+opts.target.label+'</text>';
    }
    // area + line
    var pts = opts.data.map(function(d, i) { return xPix(i).toFixed(1) + ',' + yPix(d.v).toFixed(1); });
    if (n >= 2) {
      var area = 'M'+xPix(0).toFixed(1)+','+(T+ih).toFixed(1)+' L'+pts.join(' L')+' L'+xPix(n-1).toFixed(1)+','+(T+ih).toFixed(1)+' Z';
      svg += '<path d="'+area+'" fill="'+opts.color+'" opacity="0.10"/>';
      svg += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+opts.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    opts.data.forEach(function(d, i) { svg += '<circle cx="'+xPix(i).toFixed(1)+'" cy="'+yPix(d.v).toFixed(1)+'" r="2.4" fill="'+opts.color+'"/>'; });
    // optional overlay line (e.g. moving average), values aligned to data indices; null = gap
    if (opts.overlay && opts.overlay.values) {
      var ov = opts.overlay.values, seg = [];
      function flush() { if (seg.length >= 2) svg += '<polyline points="'+seg.join(' ')+'" fill="none" stroke="'+opts.overlay.color+'" stroke-width="2" stroke-dasharray="'+(opts.overlay.dash||'')+'" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>'; seg = []; }
      ov.forEach(function(v, i){ if (v == null) { flush(); } else { seg.push(xPix(i).toFixed(1)+','+yPix(v).toFixed(1)); } });
      flush();
    }
    svg += '</svg>';
    return svg;
  }

  function niceTicks(min, max, count) {
    var span = max - min, step = span / count;
    var mag = Math.pow(10, Math.floor(Math.log(step)/Math.LN10));
    var norm = step / mag, nice;
    if (norm < 1.5) nice = 1; else if (norm < 3) nice = 2; else if (norm < 7) nice = 5; else nice = 10;
    step = nice * mag;
    var start = Math.ceil(min/step)*step, ticks = [];
    for (var v = start; v <= max + 1e-9; v += step) ticks.push(Math.round(v*10)/10);
    return ticks;
  }

  function renderWeightChart() {
    var wrap = document.createElement('div');
    wrap.appendChild(el(
      '<div class="range-row">' +
        '<button class="range-btn ' + (state.weightRange===30?'active':'') + '" data-action="wrange" data-val="30">30 Tage</button>' +
        '<button class="range-btn ' + (state.weightRange===90?'active':'') + '" data-action="wrange" data-val="90">90 Tage</button>' +
        '<button class="range-btn ' + (state.weightRange==='all'?'active':'') + '" data-action="wrange" data-val="all">Gesamt</button>' +
      '</div>'
    ));
    var ds = sortedDates().filter(function(d){ return state.entries[d].weight != null; });
    if (state.weightRange !== 'all') { var cutoff = addDays(todayStr(), -state.weightRange); ds = ds.filter(function(d){ return d >= cutoff; }); }
    var card = document.createElement('div'); card.className = 'card';
    if (ds.length < 2) { card.innerHTML = '<div class="chart-empty">Noch zu wenige Einträge für einen Verlauf in diesem Zeitraum.</div>'; wrap.appendChild(card); return wrap; }
    var vals = ds.map(function(d){ return state.entries[d].weight; });
    var target = (state.settings.targetWeight != null) ? state.settings.targetWeight : null;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (target != null) { min = Math.min(min, target); max = Math.max(max, target); }
    if (min === max) { min -= 1; max += 1; }
    var pad = (max-min)*0.15 || 1; min -= pad; max += pad;
    var ticks = niceTicks(min, max, 4).map(function(v){ return { v:v, label: v.toFixed(1) }; });
    // 7-day moving average aligned to ds indices
    var smooth = ds.map(function(d, i) {
      var sum = 0, cnt = 0;
      for (var j = Math.max(0, i-6); j <= i; j++) { sum += state.entries[ds[j]].weight; cnt++; }
      return cnt >= 3 ? sum / cnt : null;
    });
    var hasSmooth = smooth.some(function(v){ return v != null; });
    var svg = buildLineChart({
      data: ds.map(function(d){ return { label:d, v:state.entries[d].weight }; }),
      min: min, max: max, yTicks: ticks, color: 'var(--accent-green)',
      target: target != null ? { v: target, label: 'Ziel ' + target.toFixed(1) + ' kg' } : null,
      overlay: hasSmooth ? { values: smooth, color: 'var(--text-muted)', dash: '' } : null
    });
    var legend = '<div class="chart-legend"><span><span class="ln"></span>Gewicht (kg)</span>' +
      (hasSmooth ? '<span><span class="ln" style="border-top-color:var(--text-muted);"></span>Ø 7 Tage</span>' : '') +
      (target != null ? '<span><span class="ln dashed"></span>Zielgewicht</span>' : '') + '</div>';
    card.innerHTML = '<div class="chart-wrap">' + svg + '</div>' +
      '<div class="chart-caption"><span>'+niceShort(ds[0])+' · '+vals[0].toFixed(1)+' kg</span><span>'+niceShort(ds[ds.length-1])+' · '+vals[vals.length-1].toFixed(1)+' kg</span></div>' + legend;
    wrap.appendChild(card);
    return wrap;
  }

  function renderYearHeatmap() {
    var wrap = document.createElement('div'), y = state.calYear;
    wrap.appendChild(el(
      '<div class="card"><div class="cal-nav"><button data-action="cal-prev">‹</button><div class="month-label">'+y+'</div><button data-action="cal-next">›</button></div>' +
      '<div class="hm-scroll"><div class="hm-months" id="hm-months"></div><div class="hm-grid" id="hm-grid"></div></div>' + LEGEND_HTML +
      '<div class="fs" style="margin-top:12px;">Jeder Block ist ein Tag, jede Spalte eine Woche.</div></div>'
    ));
    setTimeout(function() {
      var grid = document.getElementById('hm-grid'); if (!grid) return;
      var today = todayStr();
      // start on Monday on/before Jan 1
      var first = new Date(y,0,1);
      var startOffset = (first.getDay()+6)%7;
      var cur = new Date(y,0,1); cur.setDate(cur.getDate()-startOffset);
      var end = new Date(y,11,31);
      var html = '', monthCols = [], colIdx = 0, lastMonth = -1;
      while (cur <= end) {
        for (var r=0;r<7;r++) {
          var ds = fmtDate(cur), inYear = cur.getFullYear()===y;
          var cls = 'hm-cell';
          if (!inYear || ds > today) cls += ' future';

          html += '<div class="'+cls+'"' + ((inYear && ds<=today) ? ' data-action="edit-day" data-val="'+ds+'"' : '') + '></div>';
          if (inYear && cur.getMonth() !== lastMonth && r===0) { monthCols.push({ i: colIdx, m: cur.getMonth() }); lastMonth = cur.getMonth(); }
          cur.setDate(cur.getDate()+1);
        }
        colIdx++;
      }
      grid.innerHTML = html;
      var mh = document.getElementById('hm-months');
      if (mh) mh.innerHTML = monthCols.map(function(mc){ return '<span style="width:'+(15)+'px;">'+MONTHS_DE[mc.m].slice(0,3)+'</span>'; }).join('');
    }, 0);
    return wrap;
  }

    wrap.appendChild(el(
      '<div class="card">' +
        '<div class="fs" style="margin-bottom:10px;">Alle Daten liegen lokal auf diesem Gerät (IndexedDB). Exportiere ab und zu eine Sicherung — so kannst du deine Daten auf ein neues iPhone übertragen.</div>' +
        noteHtml +
        '<button class="btn-outline" data-action="export-data">Sicherung exportieren</button>' +
        '<button class="btn-outline" data-action="import-data" style="margin-top:10px;">Sicherung importieren</button>' +
        '<input type="file" accept="application/json,.json" id="import-file-input" style="display:none;">' +
      '</div>'
    ));
    wrap.appendChild(el('<div class="section-title">Daten</div>'));
    wrap.appendChild(el('<div class="card"><button class="btn-outline btn-danger" data-action="reset-data">Alle Daten zurücksetzen</button></div>'));
    setTimeout(function() {
      var si = document.getElementById('set-start'), ti = document.getElementById('set-target'), fi = document.getElementById('import-file-input');
      if (si) si.addEventListener('change', function(){ var v=parseFloat(si.value); if(!isNaN(v)){ state.settings.startWeight=v; persistSettings(); render(); } });
      if (ti) ti.addEventListener('change', function(){ var v=parseFloat(ti.value); state.settings.targetWeight=isNaN(v)?null:v; persistSettings(); });
      if (fi) fi.addEventListener('change', function() {
        var file = fi.files && fi.files[0]; if (!file) return;
        var reader = new FileReader();
        reader.onload = function() { try { applyImport(JSON.parse(String(reader.result))); } catch(e) { state.note = { type:'err', text:'Datei ist kein gültiges JSON.' }; render(); } };
        reader.readAsText(file);
      });
    }, 0);
    return wrap;
  }

  function renderNav() {
    var items = [ {v:'home',ic:'🏠',l:'Home'}, {v:'progress',ic:'📈',l:'Verlauf'}, {v:'achievements',ic:'🏅',l:'Erfolge'}, {v:'settings',ic:'⚙️',l:'Mehr'} ];
    return el('<nav class="tabbar">' + items.map(function(i) {
      var active = (state.view===i.v) || ((state.view==='checkin'||state.view==='result') && i.v==='home');
      return '<button class="nav-btn '+(active?'active':'')+'" data-action="nav" data-val="'+i.v+'"><span class="ic">'+i.ic+'</span>'+i.l+'</button>';
    }).join('') + '</nav>');
  }

  /* ==========================================================
     EVENTS (single delegated listener)
     ========================================================== */
  document.addEventListener('click', function(ev) {
    var t = ev.target.closest('[data-action]'); if (!t) return;
    var action = t.getAttribute('data-action'), val = t.getAttribute('data-val');
    if (action === 'nav') { state.view = val; render(); }
    else if (action === 'go-home') { state.view = 'home'; state.note = null; render(); }
    else if (action === 'go-checkin') { state.activeDate = todayStr(); state.view = 'checkin'; render(); }
    else if (action === 'edit-day') { state.activeDate = val; state.view = 'checkin'; render(); }
    else if (action === 'set-sf') { state.draft.sugarFree = (val === 'true'); syncCheckinUI(); }
    else if (action === 'set-mood') { state.draft.mood = parseInt(val,10); syncCheckinUI(); }
    else if (action === 'w-minus') { state.draft.weight = Math.round((state.draft.weight-0.1)*10)/10; syncCheckinUI(); }
    else if (action === 'w-plus') { state.draft.weight = Math.round((state.draft.weight+0.1)*10)/10; syncCheckinUI(); }
    else if (action === 'save-entry') { saveEntry(); }
    else if (action === 'ptab') { state.progressTab = val; render(); }
    else if (action === 'sview') { state.sugarView = val; render(); }
    else if (action === 'mrange') { state.moodRange = (val==='all')?'all':parseInt(val,10); render(); }
    else if (action === 'close-celebrate') { hideCelebration(); }
    else if (action === 'theme') { state.settings.theme = val; persistSettings(); applyTheme(); render(); }
    else if (action === 'wrange') { state.weightRange = (val==='all')?'all':parseInt(val,10); render(); }
    else if (action === 'cal-prev') { stepCal(-1); render(); }
    else if (action === 'cal-next') { stepCal(1); render(); }
    else if (action === 'reset-data') { resetAllData(); }
    else if (action === 'export-data') { exportBackup(); }
    else if (action === 'import-data') { var fi = document.getElementById('import-file-input'); if (fi) fi.click(); }
  });

  function saveEntry() {
    if (state.draft.sugarFree === null) return;
    var d = state.activeDate || todayStr();
    var prevWeight = referenceWeightFor(d);
    state.entries[d] = { sugarFree: state.draft.sugarFree, mood: state.draft.mood, weight: state.draft.weight, note: (state.draft.note && state.draft.note.trim()) ? state.draft.note.trim() : null };
    persistEntry(d);
    var newAch = computeAndUnlockAchievements();
    var streaks = computeStreaks();
    state.lastResult = { sugarFree: state.draft.sugarFree, streak: streaks.current, weightDiff: (prevWeight!=null)?(state.draft.weight-prevWeight):null, newAchievements: newAch };
    state.view = 'result';
    render();
    var majors = newAch.filter(function(a){ return a.major; });
    if (majors.length) setTimeout(function(){ showCelebration(majors[0]); }, 250);
    else if (newAch.length) setTimeout(fireConfetti, 150);
  }

  function stepCal(dir) {
    if (state.sugarView === 'year') { state.calYear += dir; return; }
    var step = (state.sugarView === 'quarter') ? 3 : 1;
    var m = state.calMonth + dir * step;
    var y = state.calYear;
    while (m < 0) { m += 12; y--; }
    while (m > 11) { m -= 12; y++; }
    state.calMonth = m; state.calYear = y;
  }

  function resetAllData() {
    if (!window.confirm('Wirklich alle Daten löschen? Dies kann nicht rückgängig gemacht werden.')) return;
    Promise.all([clearStore('entries'), clearStore('achievements'), clearStore('meta')]).then(function() {
      state.settings = null; state.entries = {}; state.achievements = []; state.view = 'home'; state.note = null;
      render();
    });
  }

  /* ==========================================================
     BOOT
     ========================================================== */
  if (!('indexedDB' in window)) { render(); return; }
  openDB().then(function(d) {
    db = d;
    requestPersistence();
    return Promise.all([ getOne('meta','settings'), getAll('entries'), getAll('achievements') ]);
  }).then(function(res) {
    var settingsRec = res[0], entryRecs = res[1], achRecs = res[2];
    state.settings = settingsRec ? settingsRec.value : null;
    entryRecs.forEach(function(r){ state.entries[r.date] = { sugarFree: r.sugarFree, mood: r.mood, weight: r.weight, note: r.note || null }; });
    state.achievements = achRecs || [];
    applyTheme();
    render();
  }).catch(function() { render(); });

})();
</script>
</body>
</html>
