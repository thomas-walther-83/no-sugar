<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>No Sugar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Sugar">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3E7C59">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EE;
    --bg-elevated: #FFFFFF;
    --bg-sunken: #EDEAE0;
    --text: #1C2420;
    --text-muted: #5C6862;
    --text-faint: #94988F;
    --border: #DDD8C9;
    --accent-green: #3E7C59;
    --accent-green-soft: #E4EFE7;
    --accent-amber: #A97531;
    --accent-amber-soft: #F5E9D6;
    --accent-red: #9C5B52;
    --accent-red-soft: #F1E3E0;
    --nav-bg: rgba(246,244,238,0.92);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #121A16; --bg-elevated: #1B2620; --bg-sunken: #172119;
      --text: #EDEAE2; --text-muted: #93A19A; --text-faint: #5E6B64; --border: #2B372F;
      --accent-green: #5FA57B; --accent-green-soft: #1E2E24;
      --accent-amber: #D4A15C; --accent-amber-soft: #2E2617;
      --accent-red: #C17D72; --accent-red-soft: #2E1F1C;
      --nav-bg: rgba(18,26,22,0.92);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121A16; --bg-elevated: #1B2620; --bg-sunken: #172119;
    --text: #EDEAE2; --text-muted: #93A19A; --text-faint: #5E6B64; --border: #2B372F;
    --accent-green: #5FA57B; --accent-green-soft: #1E2E24;
    --accent-amber: #D4A15C; --accent-amber-soft: #2E2617;
    --accent-red: #C17D72; --accent-red-soft: #2E1F1C;
    --nav-bg: rgba(18,26,22,0.92);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text); background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overscroll-behavior-y: none;
  }
  h1, h2, h3, .num { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; border: none; background: none; color: inherit; cursor: pointer; }
  input { font-family: inherit; }

  #app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 10px; }
  .topbar .brand { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .brand span { color: var(--accent-green); }
  .topbar .date { font-size: 0.82rem; color: var(--text-muted); }

  main { flex: 1; padding: 4px 20px 100px; }

  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 14px; }

  .hero-stat { text-align: left; padding: 26px 20px 22px; }
  .hero-stat .label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
  .hero-stat .num { font-size: 3.4rem; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
  .hero-stat .num small { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 500; color: var(--text-muted); }
  .hero-stat .delta { margin-top: 10px; font-size: 0.92rem; color: var(--text-muted); }
  .hero-stat .delta.pos { color: var(--accent-red); }
  .hero-stat .delta.neg { color: var(--accent-green); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
  .stat-cell { background: var(--bg-elevated); padding: 16px 18px; }
  .stat-cell .label { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 4px; }
  .stat-cell .num { font-size: 1.6rem; font-weight: 600; }
  .stat-cell .num.fire { color: var(--accent-amber); }

  .cta-btn { width: 100%; background: var(--accent-green); color: #F6F4EE; border-radius: 14px; padding: 17px; font-size: 1.02rem; font-weight: 600; text-align: center; margin: 4px 0 6px; }
  .cta-btn:active { opacity: 0.85; }
  .cta-btn.done { background: var(--accent-green-soft); color: var(--accent-green); }

  .empty-note { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; padding: 4px 2px 14px; }
  .section-title { font-size: 1.15rem; font-weight: 600; margin: 22px 2px 10px; }
  .section-title:first-child { margin-top: 6px; }

  .q-block { margin-bottom: 26px; }
  .q-label { font-size: 1.02rem; font-weight: 500; margin-bottom: 12px; }
  .yn-row { display: flex; gap: 10px; }
  .yn-btn { flex: 1; padding: 18px 0; border-radius: 14px; background: var(--bg-sunken); border: 1.5px solid var(--border); font-size: 1rem; font-weight: 600; text-align: center; color: var(--text-muted); }
  .yn-btn.yes.active { background: var(--accent-green-soft); border-color: var(--accent-green); color: var(--accent-green); }
  .yn-btn.no.active { background: var(--accent-red-soft); border-color: var(--accent-red); color: var(--accent-red); }

  .mood-row { display: flex; justify-content: space-between; gap: 6px; }
  .mood-btn { flex: 1; padding: 12px 0 8px; border-radius: 14px; text-align: center; border: 1.5px solid transparent; font-size: 1.7rem; background: var(--bg-sunken); }
  .mood-btn span { display: block; font-size: 0.62rem; color: var(--text-muted); margin-top: 4px; font-family: 'Inter', sans-serif; }
  .mood-btn.active { border-color: var(--accent-amber); background: var(--accent-amber-soft); }

  .weight-ctrl { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 10px 0 4px; }
  .weight-step { width: 50px; height: 50px; border-radius: 50%; background: var(--bg-sunken); border: 1.5px solid var(--border); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .weight-step:active { background: var(--accent-green-soft); }
  .weight-input { border: none; background: none; text-align: center; font-family: 'Fraunces', serif; font-size: 2.6rem; font-weight: 600; width: 150px; color: var(--text); }
  .weight-input:focus { outline: none; }
  .weight-ref { text-align: center; font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

  .save-summary { text-align: center; padding: 10px 4px 4px; }
  .save-summary .big-emoji { font-size: 2.6rem; margin-bottom: 6px; }
  .save-summary h2 { margin: 0 0 6px; font-size: 1.3rem; }
  .save-summary p { color: var(--text-muted); font-size: 0.92rem; margin: 4px 0; }
  .badge-pop { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-amber-soft); color: var(--accent-amber); border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 0.88rem; font-weight: 600; }

  .tab-row { display: flex; gap: 6px; background: var(--bg-sunken); border-radius: 12px; padding: 4px; margin: 4px 0 18px; }
  .tab-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font-size: 0.86rem; font-weight: 500; color: var(--text-muted); }
  .tab-btn.active { background: var(--bg-elevated); color: var(--text); font-weight: 600; }

  .range-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .range-btn { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; color: var(--text-muted); border: 1px solid var(--border); }
  .range-btn.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

  svg.chart { width: 100%; height: auto; overflow: visible; }
  .chart-empty { text-align:center; padding: 40px 10px; color: var(--text-muted); font-size: 0.9rem; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav .month-label { font-weight: 600; font-size: 1rem; }
  .cal-nav button { font-size: 1.1rem; padding: 4px 10px; color: var(--text-muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-wd { text-align: center; font-size: 0.68rem; color: var(--text-faint); padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: var(--text-muted); background: var(--bg-sunken); }
  .cal-cell.yes { background: var(--accent-green); color: #fff; }
  .cal-cell.no { background: var(--accent-red); color: #fff; }
  .cal-cell.blank { background: transparent; }
  .cal-legend { display: flex; gap: 16px; margin-top: 14px; font-size: 0.78rem; color: var(--text-muted); }
  .cal-legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

  .mood-timeline { display: flex; overflow-x: auto; gap: 14px; padding: 4px 2px 10px; }
  .mood-tl-item { flex: 0 0 auto; text-align: center; }
  .mood-tl-item .e { font-size: 1.5rem; }
  .mood-tl-item .d { font-size: 0.66rem; color: var(--text-faint); margin-top: 4px; }

  .ach-group { margin-bottom: 22px; }
  .ach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ach-badge { text-align: center; }
  .ach-badge .circ { width: 100%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: var(--bg-sunken); border: 1.5px solid var(--border); color: var(--text-faint); }
  .ach-badge.unlocked .circ { background: var(--accent-amber-soft); border-color: var(--accent-amber); color: var(--accent-amber); }
  .ach-badge.major.unlocked .circ { background: var(--accent-green); border-color: var(--accent-green); color: #fff; }
  .ach-badge .t { font-size: 0.62rem; margin-top: 5px; color: var(--text-muted); line-height: 1.2; }

  .field-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; border-bottom: 1px solid var(--border); }
  .field-row:last-child { border-bottom: none; }
  .field-row .fl { font-size: 0.95rem; }
  .field-row input[type=number] { border: none; background: none; text-align: right; font-size: 1rem; width: 90px; color: var(--text); font-weight: 600; }
  .field-row input:focus { outline: none; }
  .btn-outline { width: 100%; text-align: center; padding: 14px; border: 1.5px solid var(--border); border-radius: 14px; font-size: 0.92rem; font-weight: 500; color: var(--text-muted); }
  .btn-danger { border-color: var(--accent-red); color: var(--accent-red); }
  .fs { font-size: 0.78rem; color: var(--text-faint); line-height: 1.5; }

  nav.tabbar { position: sticky; bottom: 0; left: 0; right: 0; display: flex; background: var(--nav-bg); backdrop-filter: blur(14px); border-top: 1px solid var(--border); padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; }
  nav.tabbar .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--text-faint); font-size: 0.64rem; font-family: 'Inter', sans-serif; }
  nav.tabbar .nav-btn .ic { font-size: 1.25rem; }
  nav.tabbar .nav-btn.active { color: var(--accent-green); }

  .onboard-wrap { padding: 60px 26px; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .onboard-wrap h1 { font-size: 2.1rem; margin: 0 0 8px; }
  .onboard-wrap .sub { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; line-height: 1.5; }
  .onboard-field { margin-bottom: 22px; }
  .onboard-field label { display: block; font-size: 0.86rem; color: var(--text-muted); margin-bottom: 8px; }
  .onboard-field input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 1.3rem; background: var(--bg-elevated); color: var(--text); font-family: 'Fraunces', serif; font-weight: 600; }
  .onboard-field input:focus { outline: none; border-color: var(--accent-green); }
  .onboard-field .hint { font-size: 0.76rem; color: var(--text-faint); margin-top: 6px; }

  #confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
  .confetti-piece { position: absolute; top: -12px; border-radius: 2px; }
  .back-row { display:flex; align-items:center; margin: 4px 0 14px; }
  .back-row button { font-size: 0.9rem; color: var(--text-muted); padding: 4px 0; }

  #boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; color: var(--text-faint); font-size: 0.9rem; }
</style>
</head>
<body>
<div id="app"><div id="boot">Lade…</div></div>
<div id="confetti-layer"></div>

<script>
(function(){
  "use strict";

  /* ==========================================================
     STORAGE LAYER — IndexedDB (durable, local-first)
     DB: nosugar
       - entries      keyPath "date"   {date, sugarFree, mood, weight}
       - achievements keyPath "id"     {id, title, category, unlockDate, major}
       - meta         keyPath "key"    {key:"settings", value:{...}}
     All data stays on the device. Nothing is sent anywhere.
     ========================================================== */
  var DB_NAME = 'nosugar', DB_VERSION = 1;
  var db = null;

  function openDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'date' });
        if (!d.objectStoreNames.contains('achievements')) d.createObjectStore('achievements', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = function(e) { resolve(e.target.result); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }
  function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
  function getAll(store) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readonly').getAll(); r.onsuccess = function(){ resolve(r.result||[]); }; r.onerror = function(){ resolve([]); }; }
      catch(e) { resolve([]); }
    });
  }
  function getOne(store, key) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readonly').get(key); r.onsuccess = function(){ resolve(r.result||null); }; r.onerror = function(){ resolve(null); }; }
      catch(e) { resolve(null); }
    });
  }
  function putRec(store, rec) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readwrite').put(rec); r.onsuccess = function(){ resolve(true); }; r.onerror = function(){ resolve(false); }; }
      catch(e) { resolve(false); }
    });
  }
  function clearStore(store) {
    return new Promise(function(resolve) {
      try { var r = tx(store, 'readwrite').clear(); r.onsuccess = function(){ resolve(true); }; r.onerror = function(){ resolve(false); }; }
      catch(e) { resolve(false); }
    });
  }
  function requestPersistence() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {} }

  /* ==========================================================
     IN-MEMORY STATE (mirror of IndexedDB, drives synchronous render)
     ========================================================== */
  var state = {
    settings: null,
    entries: {},
    achievements: [],
    view: 'home',
    progressTab: 'weight',
    weightRange: 30,
    calMonth: new Date().getMonth(),
    calYear: new Date().getFullYear(),
    activeDate: null,   // date currently being entered/edited (defaults to today)
    draft: null,
    lastResult: null,
    note: null
  };

  function persistSettings() { if (state.settings) putRec('meta', { key: 'settings', value: state.settings }); }
  function persistEntry(dateStr) { putRec('entries', Object.assign({ date: dateStr }, state.entries[dateStr])); }
  function persistAchievement(a) { putRec('achievements', a); }

  /* ==========================================================
     DATE HELPERS
     ========================================================== */
  function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function todayStr() { return fmtDate(new Date()); }
  function yesterdayStr() { var d = new Date(); d.setDate(d.getDate()-1); return fmtDate(d); }
  function addDays(str, n) { var d = new Date(str + 'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
  function niceDate(str) { return new Date(str + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' }); }
  function niceShort(str) { return new Date(str + 'T00:00:00').toLocaleDateString('de-CH', { day: 'numeric', month: 'short' }); }
  var WEEKDAYS_DE = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  var MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  var MOOD_TO_LABEL = { 5:'very_good', 4:'good', 3:'neutral', 2:'difficult', 1:'very_difficult' };
  var LABEL_TO_MOOD = { very_good:5, good:4, neutral:3, difficult:2, very_difficult:1 };

  /* ==========================================================
     DERIVED DATA
     ========================================================== */
  function sortedDates() { return Object.keys(state.entries).sort(); }
  function latestEntry() { var ds = sortedDates(); return ds.length ? { date: ds[ds.length-1], entry: state.entries[ds[ds.length-1]] } : null; }
  function currentWeight() {
    var le = latestEntry();
    if (le && le.entry.weight != null) return le.entry.weight;
    return state.settings ? state.settings.startWeight : null;
  }
  function referenceWeightFor(dateStr) {
    var ds = sortedDates().filter(function(d){ return d < dateStr && state.entries[d].weight != null; });
    if (ds.length) return state.entries[ds[ds.length-1]].weight;
    return state.settings ? state.settings.startWeight : null;
  }
  function computeStreaks() {
    var ds = sortedDates();
    var best = 0, run = 0, totalSugarFree = 0, prevDate = null;
    ds.forEach(function(d) {
      var e = state.entries[d];
      if (e.sugarFree === true) {
        totalSugarFree++;
        if (prevDate && addDays(prevDate,1) === d) run++; else run = 1;
        if (run > best) best = run;
      } else if (e.sugarFree === false) { run = 0; }
      prevDate = d;
    });
    var current = 0;
    var cursor = state.entries[todayStr()] ? todayStr() : yesterdayStr();
    while (state.entries[cursor] && state.entries[cursor].sugarFree === true) { current++; cursor = addDays(cursor, -1); }
    return { current: current, best: best, totalSugarFree: totalSugarFree };
  }

  var STREAK_ACH = [5,10,15,20,25,30,35,40,45,50,60,70,80,90,100];
  var WEEK_ACH = [ {d:7,l:'1 Woche'}, {d:14,l:'2 Wochen'}, {d:21,l:'3 Wochen'}, {d:28,l:'4 Wochen'}, {d:56,l:'8 Wochen'}, {d:84,l:'12 Wochen'}, {d:182,l:'26 Wochen'}, {d:364,l:'52 Wochen'} ];
  var WEIGHT_MAJOR = [5,10,15,20,25,30];

  function computeAndUnlockAchievements() {
    var streaks = computeStreaks();
    var unlockedIds = {};
    state.achievements.forEach(function(a){ unlockedIds[a.id] = true; });
    var newly = [];
    function add(a) { state.achievements.push(a); newly.push(a); unlockedIds[a.id] = true; persistAchievement(a); }
    STREAK_ACH.forEach(function(n) {
      var id = 'streak-' + n;
      if (streaks.current >= n && !unlockedIds[id]) add({ id: id, title: n + ' Tage zuckerfrei', category: 'streak', unlockDate: todayStr(), major: false });
    });
    WEEK_ACH.forEach(function(w) {
      var id = 'week-' + w.d;
      if (streaks.current >= w.d && !unlockedIds[id]) add({ id: id, title: w.l + ' Serie', category: 'week', unlockDate: todayStr(), major: true });
    });
    if (state.settings && state.settings.startWeight != null) {
      var cw = currentWeight();
      if (cw != null && cw < state.settings.startWeight) {
        var lostKg = Math.floor(state.settings.startWeight - cw);
        for (var k = 1; k <= lostKg; k++) {
          var wid = 'weight-' + k;
          if (!unlockedIds[wid]) add({ id: wid, title: k + ' kg verloren', category: 'weight', unlockDate: todayStr(), major: WEIGHT_MAJOR.indexOf(k) !== -1 });
        }
      }
    }
    return newly;
  }
  function computePoints() {
    var pts = 0;
    sortedDates().forEach(function(d) { pts += 1; if (state.entries[d].sugarFree === true) pts += 5; });
    state.achievements.forEach(function(a) { if (a.category === 'week') pts += 10; });
    return pts;
  }

  /* ==========================================================
     EXPORT / IMPORT
     ========================================================== */
  function buildExportObject() {
    var days = sortedDates().map(function(d) {
      var e = state.entries[d];
      return { date: d, weight: e.weight, sugarFree: e.sugarFree, mood: e.mood != null ? MOOD_TO_LABEL[e.mood] : null };
    });
    return { app: 'No Sugar', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, achievements: state.achievements, days: days };
  }
  function exportBackup() {
    var json = JSON.stringify(buildExportObject(), null, 2);
    var filename = 'no-sugar-backup-' + todayStr() + '.json';
    try {
      if (navigator.canShare) {
        var file = new File([json], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: filename }).catch(function(){}); return; }
      }
    } catch(e) {}
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 120);

  function applyImport(data) {
    var days = Array.isArray(data) ? data : (data && data.days);
    if (!days || !Array.isArray(days)) { state.note = { type: 'err', text: 'Datei enthält keine gültigen No-Sugar-Daten.' }; render(); return; }
    if (!window.confirm('Aktuelle Daten auf diesem Gerät durch die Sicherung ersetzen?')) return;
    Promise.all([clearStore('entries'), clearStore('achievements'), clearStore('meta')]).then(function() {
      state.entries = {}; state.achievements = [];
      days.forEach(function(rec) {
        if (!rec || !rec.date) return;
        var mood = (typeof rec.mood === 'number') ? rec.mood : (rec.mood != null ? LABEL_TO_MOOD[rec.mood] : null);
        state.entries[rec.date] = {
          sugarFree: (rec.sugarFree === true || rec.sugarFree === false) ? rec.sugarFree : null,
          mood: mood != null ? mood : null,
          weight: (typeof rec.weight === 'number') ? rec.weight : null
        };
        persistEntry(rec.date);
      });
      if (!Array.isArray(data) && data.settings) { state.settings = data.settings; persistSettings(); }
      if (!Array.isArray(data) && Array.isArray(data.achievements)) { state.achievements = data.achievements.slice(); state.achievements.forEach(persistAchievement); }
      else { computeAndUnlockAchievements(); }
      state.note = { type: 'ok', text: 'Sicherung wiederhergestellt.' };

    var action = t.getAttribute('data-action'), val = t.getAttribute('data-val');
    if (action === 'nav') { state.view = val; render(); }
    else if (action === 'go-home') { state.view = 'home'; state.note = null; render(); }
    else if (action === 'go-checkin') { state.activeDate = todayStr(); state.view = 'checkin'; render(); }

    else if (action === 'set-mood') { state.draft.mood = parseInt(val,10); syncCheckinUI(); }
    else if (action === 'w-minus') { state.draft.weight = Math.round((state.draft.weight-0.1)*10)/10; syncCheckinUI(); }
    else if (action === 'w-plus') { state.draft.weight = Math.round((state.draft.weight+0.1)*10)/10; syncCheckinUI(); }
    else if (action === 'save-entry') { saveEntry(); }
    else if (action === 'ptab') { state.progressTab = val; render(); }
    else if (action === 'wrange') { state.weightRange = (val==='all')?'all':parseInt(val,10); render(); }
    else if (action === 'cal-prev') { state.calMonth--; if (state.calMonth<0){ state.calMonth=11; state.calYear--; } render(); }
    else if (action === 'cal-next') { state.calMonth++; if (state.calMonth>11){ state.calMonth=0; state.calYear++; } render(); }
    else if (action === 'reset-data') { resetAllData(); }
    else if (action === 'export-data') { exportBackup(); }
    else if (action === 'import-data') { var fi = document.getElementById('import-file-input'); if (fi) fi.click(); }
  });

  function saveEntry() {
    if (state.draft.sugarFree === null) return;
    var d = state.activeDate || todayStr();
    var prevWeight = referenceWeightFor(d);
    state.entries[d] = { sugarFree: state.draft.sugarFree, mood: state.draft.mood, weight: state.draft.weight };
    persistEntry(d);
    var newAch = computeAndUnlockAchievements();
    var streaks = computeStreaks();
    state.lastResult = { sugarFree: state.draft.sugarFree, streak: streaks.current, weightDiff: (prevWeight!=null)?(state.draft.weight-prevWeight):null, newAchievements: newAch };
    state.view = 'result';
    render();
    if (newAch.some(function(a){ return a.major; })) setTimeout(fireConfetti, 150);
  }

  function resetAllData() {
    if (!window.confirm('Wirklich alle Daten löschen? Dies kann nicht rückgängig gemacht werden.')) return;
    Promise.all([clearStore('entries'), clearStore('achievements'), clearStore('meta')]).then(function() {
      state.settings = null; state.entries = {}; state.achievements = []; state.view = 'home'; state.note = null;
      render();
    });
  }

  /* ==========================================================
     BOOT
     ========================================================== */
  if (!('indexedDB' in window)) { render(); return; }
  openDB().then(function(d) {
    db = d;
    requestPersistence();
    return Promise.all([ getOne('meta','settings'), getAll('entries'), getAll('achievements') ]);
  }).then(function(res) {
    var settingsRec = res[0], entryRecs = res[1], achRecs = res[2];
    state.settings = settingsRec ? settingsRec.value : null;
    entryRecs.forEach(function(r){ state.entries[r.date] = { sugarFree: r.sugarFree, mood: r.mood, weight: r.weight }; });
    state.achievements = achRecs || [];
    render();
  }).catch(function() { render(); });

})();
</script>
</body>
</html>
